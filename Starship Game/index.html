<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Starship Game</title>
	<link rel="stylesheet" href="../styles.css"> <!-- Adjust the path as necessary -->
	<style>
		* {
			margin: 0;
			overflow: hidden;
			/* stop ios selection magnification/highlighting/dragging: */
			-webkit-touch-callout: none;
			-webkit-user-callout: none;
			-webkit-user-select: none;
			-webkit-user-drag: none;
			-webkit-user-modify: none;
			-webkit-highlight: none;
			-ms-user-select: none;
			user-select: none;
		}
		nav {
			position: relative; /* Make the nav position relative for absolute positioning */
			transition: transform 0.3s ease, opacity 0.3s ease; /* Smooth transition for hiding */
			padding: 10px 0; /* Decrease padding to raise the nav bar content */
			background-color: #333; /* Example background color */
		}

		.hidden {
			transform: translateY(-100%); /* Move the nav up out of view */
			opacity: 0; /* Fade out effect */
		}

		.nav-links {
			display: flex; /* Default to horizontal layout */
			flex-direction: row; /* Align links horizontally */
			list-style: none;
			display: flex;
		}

		@media (max-width: 768px) {
			.nav-links {
				display: none; /* Hide links by default on mobile */
				flex-direction: column; /* Stack links vertically */
				position: absolute; /* Position them absolutely */
				top: 100%; /* Position below the navbar */
				left: 0; /* Align to the left */
				width: 100%; /* Full width */
				background-color: white; /* Background color for the dropdown */
				z-index: 5; /* Ensure it appears above other elements */
			}

			.nav-content.active .nav-links {
				display: flex; /* Show links when the navbar is active */
			}
		}

		.nav-content {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.nav-links li {
			margin: 0 15px; /* Example spacing */
		}

		.nav-links a {
			color: white; /* Example text color */
			text-decoration: none; /* Remove underline */
		}

		.nav-links a:hover {
			text-decoration: underline; /* Underline on hover */
		}

		.nav-name {
			color: white; /* Set the name color to white */
		}
	</style>
	<script type="module" src="./main.js"></script>
</head>

<body>
	<nav id="navbar">
		<div class="nav-content">
			<h1 class="nav-name">Jackson Yuen</h1>
			<div class="mobile-menu-btn">
				<span></span>
				<span></span>
				<span></span>
			</div>
			<ul class="nav-links">
				<li><a href="../index.html#home">Home</a></li>
				<li><a href="../index.html#about">About</a></li>
				<li><a href="../index.html#skills">Skills</a></li>
				<li><a href="../index.html#projects">Projects</a></li>
				<li><a href="../index.html#blog">Blog</a></li>
				<li><a href="../index.html#contact">Contact</a></li>
				<li><a href="../your-resume.pdf" class="resume-btn" download>Download Resume</a></li>
			</ul>
		</div>
	</nav>

	<script>
		const navbar = document.getElementById('navbar'); // Get the nav element
		// You can implement a different way to toggle the navbar visibility if needed
	</script>
</body>

</html>
